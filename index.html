<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Premier League Predictor 2025/26</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#1a0020;min-height:100vh;display:flex;flex-direction:column;align-items:center;font-family:'Poppins',sans-serif;}

#app{width:100%;max-width:860px;padding:28px 14px 36px;display:flex;flex-direction:column;align-items:center;}

#header{display:flex;flex-direction:column;align-items:center;margin-bottom:16px;}
#pl-logo-img{width:60px;height:60px;object-fit:contain;display:block;}

#name-input{
  background:transparent;border:none;border-bottom:2px solid rgba(0,255,133,0.4);
  color:#fff;font-size:36px;font-weight:800;text-align:center;
  width:340px;padding:4px 8px;outline:none;
  font-family:'Poppins',sans-serif;letter-spacing:1px;
  transition:border-color 0.2s;margin-bottom:20px;
}
#name-input:focus{border-bottom-color:#00ff85;}
#name-input::placeholder{color:rgba(255,255,255,0.2);}

#capture-area{display:flex;gap:18px;width:100%;align-items:flex-start;}

/* LIST */
#list-col{flex:0 0 340px;}
#legend{display:flex;gap:12px;margin-bottom:9px;flex-wrap:wrap;}
.leg-item{display:flex;align-items:center;gap:5px;font-size:9px;font-weight:600;color:rgba(255,255,255,0.4);font-family:'Poppins',sans-serif;text-transform:uppercase;letter-spacing:1px;}
.leg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0;}

#list{list-style:none;}
.team-row{
  display:flex;align-items:center;
  background:#fff;border-radius:6px;
  margin-bottom:4px;padding:0 0 0 10px;
  cursor:grab;user-select:none;height:50px;
  touch-action:none;
  transition:opacity 0.15s,box-shadow 0.1s;
  gap:10px;
}
.team-row:hover{box-shadow:0 0 0 2px #00ff85;}
.team-row.is-dragging{opacity:0.2;}
.team-row.drag-ghost{opacity:1!important;box-shadow:0 8px 32px rgba(0,0,0,0.6),0 0 0 2px #00ff85!important;cursor:grabbing;}
.drop-indicator{height:2px;background:#00ff85;border-radius:1px;margin:-2px 0 2px;box-shadow:0 0 8px #00ff85;}

/* Square position badge */
.pos-badge{
  width:30px;height:30px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:#fff;flex-shrink:0;
  font-family:'Poppins',sans-serif;
}
.pos-cl{background:#1a4fa0;}
.pos-europe{background:#f75e1c;}
.pos-mid{background:#4a1060;}
.pos-rel{background:#c0392b;}

.badge-wrap{width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.badge-wrap img{width:34px;height:34px;object-fit:contain;display:block;}
.team-name{flex:1;font-size:13px;font-weight:600;color:#111122;font-family:'Poppins',sans-serif;}
.drag-handle{color:rgba(0,0,0,0.12);font-size:18px;margin-right:10px;flex-shrink:0;}

/* EXTRAS */
#extras-col{flex:1;display:flex;flex-direction:column;gap:0;}
.extras-header{
  color:#00ff85;font-family:'Poppins',sans-serif;font-weight:800;
  font-size:11px;letter-spacing:2px;text-transform:uppercase;
  border-bottom:1px solid rgba(0,255,133,0.25);padding-bottom:8px;margin-bottom:8px;
}
.extra-card{
  background:rgba(255,255,255,0.05);
  padding:10px 12px 12px 14px;
  border-left:3px solid #00ff85;
  margin-bottom:5px;
  border-radius:0 6px 6px 0;
  transition:background 0.15s;
}
.extra-card:hover{background:rgba(255,255,255,0.08);}
.extra-card label{
  display:block;color:rgba(255,255,255,0.4);font-size:9px;font-weight:600;
  font-family:'Poppins',sans-serif;text-transform:uppercase;letter-spacing:2px;margin-bottom:6px;
}
.extra-card input{
  width:100%;background:transparent;border:none;
  color:#fff;font-size:20px;font-weight:700;padding:0;outline:none;
  font-family:'Poppins',sans-serif;line-height:1.1;
}
.extra-card input::placeholder{color:rgba(255,255,255,0.15);font-weight:400;font-size:16px;}

#export-btn{
  margin-top:22px;background:#00ff85;color:#37003c;font-weight:700;font-size:11px;
  border:none;border-radius:4px;padding:13px 36px;cursor:pointer;
  font-family:'Poppins',sans-serif;letter-spacing:2px;text-transform:uppercase;
  transition:background 0.15s,transform 0.1s;
}
#export-btn:hover{background:#00e876;transform:translateY(-1px);}
#export-btn:active{transform:translateY(0);}
.cup-card{
  background:rgba(255,255,255,0.05);
  padding:10px 12px 12px 14px;
  border-left:3px solid #00ff85;
  margin-bottom:5px;
  border-radius:0 6px 6px 0;
  transition:background 0.15s;
}
.cup-card:hover{background:rgba(255,255,255,0.08);}
.cup-card .cup-header{
  display:flex;align-items:center;gap:8px;margin-bottom:6px;
}
.cup-card .cup-logo{
  width:22px;height:22px;object-fit:contain;flex-shrink:0;object-fit:contain;
}
.cup-card label{
  display:block;color:rgba(255,255,255,0.4);font-size:9px;font-weight:600;
  font-family:'Poppins',sans-serif;text-transform:uppercase;letter-spacing:2px;
}
.cup-card .cup-input-wrap{position:relative;display:flex;align-items:center;gap:8px;}
.cup-card .selected-badge{width:30px;height:30px;object-fit:contain;flex-shrink:0;display:none;}
.cup-card input{
  flex:1;background:transparent;border:none;
  color:#fff;font-size:20px;font-weight:700;padding:0;outline:none;
  font-family:'Poppins',sans-serif;line-height:1.1;min-width:0;
}
.cup-card input::placeholder{color:rgba(255,255,255,0.15);font-weight:400;font-size:16px;}
.ac-dropdown{
  position:absolute;top:100%;left:0;right:0;z-index:100;
  background:#2a003a;border:1px solid rgba(0,255,133,0.3);border-radius:4px;
  overflow:hidden;margin-top:2px;
}
.ac-item{
  display:flex;align-items:center;gap:8px;padding:6px 10px;cursor:pointer;
  font-family:'Poppins',sans-serif;font-size:13px;font-weight:600;color:#fff;
  transition:background 0.1s;
}
.ac-item:hover,.ac-item.active{background:rgba(0,255,133,0.15);}
.ac-item img{width:22px;height:22px;object-fit:contain;flex-shrink:0;}
</style>
</head>

let order = teamDefs.map((_,i)=>i);
let ghost=null,ghostOffsetY=0,dragSrc=null,dropPos=null;

function getZoneClass(pos){
  if(pos<4) return 'pos-cl';
  if(pos<6) return 'pos-europe';
  if(pos>=17) return 'pos-rel';
  return 'pos-mid';
}
function getDropPos(y){
  const rows=[...document.querySelectorAll('#list .team-row')];
  for(let i=0;i<rows.length;i++){const r=rows[i].getBoundingClientRect();if(y<r.top+r.height/2)return i;}
  return rows.length;
}
function removeIndicators(){document.querySelectorAll('#list .drop-indicator').forEach(e=>e.remove());}
function showIndicator(pos){
  removeIndicators();
  const rows=[...document.querySelectorAll('#list .team-row')];
  const div=document.createElement('div');div.className='drop-indicator';
  if(pos>=rows.length)document.getElementById('list').appendChild(div);
  else document.getElementById('list').insertBefore(div,rows[pos]);
}
function removeGhost(){if(ghost){ghost.remove();ghost=null;}}
function createGhost(li,y){
  ghost=li.cloneNode(true);ghost.className='team-row drag-ghost';
  const r=li.getBoundingClientRect();ghostOffsetY=y-r.top;
  Object.assign(ghost.style,{position:'fixed',left:r.left+'px',width:r.width+'px',top:(y-ghostOffsetY)+'px',pointerEvents:'none',zIndex:'9999',margin:'0',transition:'none'});
  document.body.appendChild(ghost);
}
function doMove(from,to){
  if(from===to||from===to-1)return;
  const no=[...order];const[m]=no.splice(from,1);no.splice(to>from?to-1:to,0,m);order=no;render();
}

function render(){
  const list=document.getElementById('list');list.innerHTML='';
  order.forEach((ti,pos)=>{
    const t=teamDefs[ti];const li=document.createElement('li');li.className='team-row';
    const src=REAL_LOGOS[t.id]||'';const zc=getZoneClass(pos);
    li.innerHTML=`
      <div class="pos-badge ${zc}">${pos+1}</div>
      <div class="badge-wrap"><img src="${src}" alt="${t.name}"/></div>
      <span class="team-name">${t.name}</span>
      <span class="drag-handle">⠿</span>
    `;
    const from=pos;
    li.addEventListener('mousedown',e=>{
      if(e.button!==0)return;dragSrc=from;li.classList.add('is-dragging');createGhost(li,e.clientY);
      const onMove=ev=>{ghost.style.top=(ev.clientY-ghostOffsetY)+'px';dropPos=getDropPos(ev.clientY);showIndicator(dropPos);};
      const onUp=()=>{li.classList.remove('is-dragging');removeGhost();removeIndicators();if(dropPos!==null)doMove(dragSrc,dropPos);dragSrc=dropPos=null;document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);};
      document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onUp);e.preventDefault();
    });
    li.addEventListener('touchstart',e=>{dragSrc=from;li.classList.add('is-dragging');createGhost(li,e.touches[0].clientY);},{passive:true});
    li.addEventListener('touchmove',e=>{e.preventDefault();const y=e.touches[0].clientY;ghost.style.top=(y-ghostOffsetY)+'px';dropPos=getDropPos(y);showIndicator(dropPos);},{passive:false});
    li.addEventListener('touchend',()=>{li.classList.remove('is-dragging');removeGhost();removeIndicators();if(dropPos!==null)doMove(dragSrc,dropPos);dragSrc=dropPos=null;});
    list.appendChild(li);
  });
}

  grad.addColorStop(0,'#200030');grad.addColorStop(1,'#110018');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

  // PL logo (no black bg — transparent)
  const logoX=(W-LOGO_SIZE)/2, logoY=PAD;
  if(plLogoImg)ctx.drawImage(plLogoImg,logoX,logoY,LOGO_SIZE,LOGO_SIZE);

  // Name
  const nameY=logoY+LOGO_SIZE+14;
  ctx.fillStyle='#ffffff';
  ctx.font='800 40px Poppins, Arial, sans-serif';
  ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillText(nameVal,W/2,nameY);

  // Divider
  const divY=nameY+NAME_FONT_SIZE+12;
  ctx.fillStyle='rgba(0,255,133,0.2)';ctx.fillRect(PAD,divY,W-PAD*2,1);

  const listTop=divY+14;
  const listLeft=PAD;

  // List rows
  for(let i=0;i<order.length;i++){
    const t=teamDefs[order[i]];
    const y=listTop+i*(ROW_H+ROW_GAP);

    // White card
    ctx.fillStyle='#ffffff';
    ctx.beginPath();ctx.roundRect(listLeft,y,LIST_W,ROW_H,6);ctx.fill();

    // Square pos badge
    const BADGE_SIZE=30, BADGE_X=listLeft+10, BADGE_Y=y+(ROW_H-BADGE_SIZE)/2;
    let bgColor='#4a1060';
    if(i<4)bgColor='#1a4fa0';
    else if(i<6)bgColor='#f75e1c';
    else if(i>=17)bgColor='#c0392b';
    ctx.fillStyle=bgColor;
    ctx.beginPath();ctx.roundRect(BADGE_X,BADGE_Y,BADGE_SIZE,BADGE_SIZE,5);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='700 13px Poppins, Arial, sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(i+1,BADGE_X+BADGE_SIZE/2,BADGE_Y+BADGE_SIZE/2);

    // Club badge
    const bSize=34, bx=listLeft+48, by=y+(ROW_H-bSize)/2;
    const img=logoImgs[t.id];
    if(img)ctx.drawImage(img,bx,by,bSize,bSize);

    // Team name (proper case)
    ctx.fillStyle='#111122';ctx.font='600 14px Poppins, Arial, sans-serif';
    ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillText(t.name,listLeft+90,y+ROW_H/2);
  }

  // Extras col
  const ex=listLeft+LIST_W+18;

  // Section title
  ctx.fillStyle='#00ff85';ctx.font='700 10px Poppins, Arial, sans-serif';
  ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText('SEASON AWARDS',ex,listTop+4);
  ctx.fillStyle='rgba(0,255,133,0.2)';ctx.fillRect(ex,listTop+22,EXTRA_W,1);

  extras.forEach((e2,i)=>{
    const ey=listTop+EXTRAS_TITLE_H+i*(EXTRA_CARD_H+EXTRA_GAP);
    ctx.fillStyle='rgba(255,255,255,0.05)';
    ctx.beginPath();ctx.roundRect(ex,ey,EXTRA_W,EXTRA_CARD_H,5);ctx.fill();
    ctx.fillStyle='#00ff85';
    ctx.beginPath();ctx.roundRect(ex,ey,3,EXTRA_CARD_H,2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='600 9px Poppins, Arial, sans-serif';
    ctx.textAlign='left';ctx.textBaseline='top';
    ctx.fillText(e2.label.toUpperCase(),ex+12,ey+CARD_PAD_T);
    ctx.fillStyle='#ffffff';ctx.font='700 22px Poppins, Arial, sans-serif';
    ctx.textBaseline='top';
    ctx.fillText(e2.val||'—',ex+12,ey+CARD_PAD_T+LABEL_H+5);
  });

  // Cups section
  const cupsTop=listTop+EXTRAS_TITLE_H+extras.length*(EXTRA_CARD_H+EXTRA_GAP)+10;
  ctx.fillStyle='#00ff85';ctx.font='700 10px Poppins, Arial, sans-serif';
  ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText('CUPS',ex,cupsTop+4);
  ctx.fillStyle='rgba(0,255,133,0.2)';ctx.fillRect(ex,cupsTop+22,EXTRA_W,1);

  cups.forEach((c,i)=>{
    const ey=cupsTop+EXTRAS_TITLE_H+i*(CUP_CARD_H+EXTRA_GAP);
    ctx.fillStyle='rgba(255,255,255,0.05)';
    ctx.beginPath();ctx.roundRect(ex,ey,EXTRA_W,CUP_CARD_H,5);ctx.fill();
    ctx.fillStyle='#00ff85';
    ctx.beginPath();ctx.roundRect(ex,ey,3,EXTRA_CARD_H,2);ctx.fill();
    // Cup header
    const clogo=cupLogoMap[c.logoId];
    const logoX=ex+12;
    const logoY=ey+CARD_PAD_T;
    const labelX=logoX+CUP_LOGO_SIZE+6;
    const labelY=logoY+(CUP_LOGO_SIZE-LABEL_H)/2;
    const badgeX=ex+12;
    const badgeY=logoY+CUP_LOGO_SIZE+10;
    const textX=badgeX+CUP_BADGE_SIZE+10;

    ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='600 10px Poppins, Arial, sans-serif';
    ctx.textAlign='left';ctx.textBaseline='top';
    if(clogo) drawImageFit(clogo, logoX, logoY, CUP_LOGO_SIZE, CUP_LOGO_SIZE);
    ctx.fillText(c.label.toUpperCase(),labelX,labelY);

    const winnerName=(c.val||'—').trim();
    const winnerTeam=teamDefs.find(t=>t.name.toLowerCase()===winnerName.toLowerCase());
    const badgeImg=winnerTeam && logoImgs[winnerTeam.id];
    if(badgeImg) drawImageFit(badgeImg, badgeX, badgeY, CUP_BADGE_SIZE, CUP_BADGE_SIZE);

    ctx.fillStyle='#ffffff';ctx.font='700 20px Poppins, Arial, sans-serif';
    ctx.textBaseline='middle';
    ctx.fillText(c.val||'—',textX,badgeY+CUP_BADGE_SIZE/2);
  });

  const a=document.createElement('a');
  a.download=(nameVal.replace(/\s+/g,'_')+'_pl_predictor.png');
  a.href=canvas.toDataURL('image/png');a.click();
});

// ─── AUTOCOMPLETE ─────────────────────────────────────────────────────────────
function setupCupAutocomplete(inputId, dropId, badgeId) {
  const input = document.getElementById(inputId);
  const drop = document.getElementById(dropId);
  const badge = document.getElementById(badgeId);
  let activeIdx = -1;
  let selectedTeam = null;

  function getMatches(q) {
    if (!q) return [];
    const lq = q.toLowerCase();
    return teamDefs.filter(t => t.name.toLowerCase().includes(lq));
  }

  function selectTeam(t) {
    selectedTeam = t;
    input.value = t.name;
    const src = REAL_LOGOS[t.id] || '';
    badge.src = src;
    badge.style.display = src ? 'block' : 'none';
    drop.style.display = 'none';
  }

  function clearBadge() {
    // only clear badge if typed text doesn't match selected team
    if (selectedTeam && input.value.toLowerCase() !== selectedTeam.name.toLowerCase()) {
      selectedTeam = null;
      badge.style.display = 'none';
    }
  }

  function renderDrop(matches) {
    if (!matches.length) { drop.style.display = 'none'; return; }
    drop.innerHTML = '';
    activeIdx = -1;
    matches.forEach((t, i) => {
      const item = document.createElement('div');
      item.className = 'ac-item';
      const src = REAL_LOGOS[t.id] || '';
      item.innerHTML = `<img src="${src}" alt="${t.name}"/><span>${t.name}</span>`;
      item.addEventListener('mousedown', e => {
        e.preventDefault();
        selectTeam(t);
      });
      drop.appendChild(item);
    });
    drop.style.display = 'block';
  }

  input.addEventListener('input', () => { clearBadge(); renderDrop(getMatches(input.value)); });
  input.addEventListener('keydown', e => {
    const items = drop.querySelectorAll('.ac-item');
    if (e.key === 'ArrowDown') { e.preventDefault(); activeIdx = Math.min(activeIdx+1, items.length-1); items.forEach((el,i)=>el.classList.toggle('active',i===activeIdx)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); activeIdx = Math.max(activeIdx-1, 0); items.forEach((el,i)=>el.classList.toggle('active',i===activeIdx)); }
    else if (e.key === 'Enter' && activeIdx >= 0) {
      const t = teamDefs.find(td => td.name === items[activeIdx].querySelector('span').textContent);
      if (t) selectTeam(t); else { input.value = items[activeIdx].querySelector('span').textContent; drop.style.display = 'none'; }
    }
    else if (e.key === 'Escape') { drop.style.display = 'none'; }
  });
  input.addEventListener('blur', () => setTimeout(() => { drop.style.display = 'none'; }, 150));
}

setupCupAutocomplete('c-fa', 'ac-fa', 'badge-fa');
setupCupAutocomplete('c-cb', 'ac-cb', 'badge-cb');

render();
</script>
